name: Release build

# Called by Create release PR on the release branch before the pull request
# exists (D28). It builds the MKP, which the publish attaches to the release.
on:
  workflow_call:
    inputs:
      version:
        description: The version being released.
        type: string
        required: true
      ref:
        description: The release branch head to build.
        type: string
        required: true

permissions:
  contents: read

jobs:
  mkp:
    uses: oposs/repo-infra/.github/workflows/ri-release-mkp.yml@v2
    with:
      version: ${{ inputs.version }}
      ref: ${{ inputs.ref }}
